services:
  postgres:
    image: postgres:15-alpine
    container_name: aimate_pms_db
    environment:
      POSTGRES_DB: aimate_pms
      POSTGRES_USER: aimate
      POSTGRES_PASSWORD: aimate_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimate -d aimate_pms"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
